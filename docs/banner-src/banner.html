<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'AlegreyaSC'; src: url('AlegreyaSC-700.woff2'); font-weight: 700; }
@font-face { font-family: 'AlegreyaSans'; src: url('AlegreyaSans-400.woff2'); font-weight: 400; }
@font-face { font-family: 'AlegreyaSans'; src: url('AlegreyaSans-700.woff2'); font-weight: 700; }
@font-face { font-family: 'Alegreya'; src: url('Alegreya-400i.woff2'); font-style: italic; }
html, body { margin: 0; padding: 0; }
.b { width: 1280px; height: 640px; position: relative; overflow: hidden;
  background: radial-gradient(ellipse at 30% 40%, #1f3a4c 0%, #12212c 55%, #0b141b 100%); }
.map { position: absolute; inset: -40px; background: url('valley-player.webp') center/cover; opacity: .10; filter: sepia(.6) contrast(1.1); transform: rotate(-4deg) scale(1.15); }
.glow { position: absolute; right: 120px; top: 120px; width: 520px; height: 420px; background: radial-gradient(circle, rgba(232,176,82,.28), rgba(232,176,82,0) 65%); }
.text { position: absolute; left: 70px; top: 92px; width: 560px; color: #f3ead6; }
.eyebrow { font-family: 'AlegreyaSans'; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; font-size: 15px; color: #e8b052; }
h1 { font-family: 'AlegreyaSC'; font-weight: 700; font-size: 92px; line-height: .95; margin: 14px 0 18px; color: #fbf3e2; text-shadow: 0 4px 24px rgba(0,0,0,.45); }
.tag { font-family: 'Alegreya'; font-style: italic; font-size: 30px; line-height: 1.25; color: #f3ead6; }
.prompts { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
.p { font-family: 'AlegreyaSans'; font-size: 19px; color: #cfe0ea; background: rgba(255,255,255,.07); border: 1px solid rgba(232,176,82,.35);
  border-radius: 999px; padding: 8px 18px; width: fit-content; }
.p b { color: #e8b052; font-weight: 700; margin-right: 6px; }
.covers { position: absolute; right: 40px; top: 60px; width: 640px; height: 540px; }
.c { position: absolute; width: 230px; border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
</style></head><body>
<div class="b">
  <div class="map"></div>
  <div class="glow"></div>
  <div class="text">
    <div class="eyebrow">An AI skill for tabletop RPGs</div>
    <h1>Campaign<br>Writer</h1>
    <div class="tag">Say what adventure you want.<br>Get the whole book, maps and all.</div>
    <div class="prompts">
      <div class="p"><b>›</b>"a spooky lighthouse one-shot for four level-3s"</div>
      <div class="p"><b>›</b>"teach me physics through D&amp;D"</div>
      <div class="p"><b>›</b>"a solo Pathfinder campaign where I hunt trolls"</div>
    </div>
  </div>
  <div class="covers">
    <img class="c" src="cover-cthulhu.webp" style="left: 20px; top: 90px; transform: rotate(-14deg);">
    <img class="c" src="cover-fractions.webp" style="left: 120px; top: 50px; transform: rotate(-7deg);">
    <img class="c" src="cover-pirates.webp" style="left: 400px; top: 70px; transform: rotate(10deg);">
    <img class="c" src="cover-physics.webp" style="left: 300px; top: 40px; transform: rotate(4deg);">
    <img class="c" src="cover-lighthouse.webp" style="left: 205px; top: 20px; transform: rotate(-1deg); width: 245px;">
  </div>
</div>
</body></html>
